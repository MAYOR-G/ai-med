[project]
name = "ai-med-api"
version = "0.1.0"
description = "Local API for the AI Med medical-document intelligence prototype"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0",
  "argon2-cffi>=23.1.0",
  "asyncpg>=0.30.0",
  "email-validator>=2.2.0",
  "fastapi>=0.115.0",
  "google-genai>=1.0.0",
  "pymupdf>=1.24.13",
  "pydantic-settings>=2.6.0",
  "pyjwt>=2.10.0",
  "python-multipart>=0.0.12",
  "python-docx>=1.1.2",
  "sqlalchemy>=2.0.36",
  "supabase>=2.10.0",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.27.2", "pytest>=8.3.3", "pytest-asyncio>=0.24.0", "ruff>=0.7.3"]
rag = ["chromadb>=0.5.18"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "storage*", "chroma_data*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
